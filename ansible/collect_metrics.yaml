- name: Collect VM metrics
  hosts: tag_Environment__dev
  become: true
  gather_facts: true
  tasks:
    - name: Install sysstat
      package:
        name: sysstat
        state: present

    - name: Get CPU usage
      shell: mpstat 1 1 | awk '/Average/ && $NF ~ /[0-9.]+/ {print 100 - $NF}'
      register: cpu_usage

    - name: Get memory usage percentage
      shell: free | awk '/Mem/ {printf "%.2f", ($3/$2) * 100.0}'
      register: mem_usage

    - name: Get disk usage
      shell: df / | awk 'NR==2 {print $5}' | tr -d '%'
      register: disk_usage

    - name: Parse and store metrics
      set_fact:
        host_metrics:
          hostname: "{{ inventory_hostname }}"
          cpu: "{{ cpu_usage.stdout | float | round(2) }}"
          mem: "{{ mem_usage.stdout | float | round(2) }}"
          disk: "{{ disk_usage.stdout | float | round(2) }}"

- name: Aggregate all metrics
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Collect all host metrics
      set_fact:
        all_metrics: "{{ groups['tag_Environment__dev'] | map('extract', hostvars, 'host_metrics') | list }}"
